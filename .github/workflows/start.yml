name: Start Scanner

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract project
        run: |
          unzip -o fragment_username_scanner.zip -d project
          echo "Project contents:"
          ls -la project
          echo "Scanner folder:"
          ls -la project/scanner

      - name: Install dependencies
        working-directory: project
        run: |
          pip install -r requirements-actions.txt

      - name: Run scanner
        working-directory: project
        env:
          PYTHONPATH: ${{ github.workspace }}/project
          FRAGMENT_SCANNER_BOT_TOKEN: ${{ secrets.FRAGMENT_SCANNER_BOT_TOKEN }}
          FRAGMENT_SCANNER_CHAT_ID: "@fragmentalerts2"
        run: |
          python scripts/scan_and_notify.py
