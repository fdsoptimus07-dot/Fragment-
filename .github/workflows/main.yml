name: Fragment Username Scanner

on:
  schedule:
    # Every 15 minutes. GitHub Actions cron is best-effort — during
    # platform load, runs can be delayed by several minutes; that's a
    # GitHub-side limitation, not a bug here. Anything below ~5 min
    # isn't realistically honored anyway.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed to commit the updated database back to the repo

concurrency:
  group: fragment-scanner
  cancel-in-progress: false   # never cancel a run that might be mid-notify

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-actions.txt

      - name: Run scan and notify
        env:
          FRAGMENT_SCANNER_BOT_TOKEN: ${{ secrets.FRAGMENT_SCANNER_BOT_TOKEN }}
          FRAGMENT_SCANNER_CHAT_ID: ${{ secrets.FRAGMENT_SCANNER_CHAT_ID }}
        run: python scripts/scan_and_notify.py

      - name: Persist scanner state
        run: |
          git config user.name "fragment-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add db/scanner.sqlite3
          if ! git diff --cached --quiet; then
            # pull any state another run committed in the meantime,
            # so we never push over (and lose) its "already notified" data
            git pull --rebase origin main
            git commit -m "chore: update scanner state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
